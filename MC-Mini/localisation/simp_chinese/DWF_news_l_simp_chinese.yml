l_simp_chinese:
# ==== 2026-08-24 DWF新闻批 ====
 DWF_news.1.t:0 "戈壁大会——多玩第一次全国代表大会开幕"
 DWF_news.1.d:0 "本报乌鲁木齐电：昨日清晨，随着一百二十七声驼铃在政务厅前齐齐停住，多玩第一次全国代表大会在乌鲁木齐开幕。西北六州与中亚、西藏各处的代表历时月余，骑马、乘车、徒步，穿过戈壁与雪山，在同一面会旗下坐定。会场没有暖气，代表们呵着白气签字；没有议席牌，名字用毛笔写在红纸上，贴在桌沿。大会秘书长在开幕词中只讲了一句话：「我们不是来开会的，我们是来建国的。」据与会者透露，大会将审议章程、选举党魁、确定国号国策。各方观察家指出，这个从帝国西北角落里生长出来的政治力量，正在从一场运动变成一个国家。街头的报童把号外塞进每一双手里，卖得最快的不是甜馒头，是报纸。"
 DWF_news.1.a:0 "建国了"
 DWF_news.2.t:0 "多玩选出新党魁——解放派掌印"
 DWF_news.2.d:0 "本报乌鲁木齐电：多玩第一次全国代表大会昨日闭幕，解放派候选人当选党魁。投票从傍晚进行到深夜，唱票声隔着两条街都听得见。新党魁在就职讲话中没有讲稿，只有一张全域舆图：「从今天起，会议记录里不许再出现『待议』两个字。」会场外的老兵们把帽子抛上了天。分析人士指出，解放派的上台意味着多玩将把军事放在首位——南下的路，也许比所有人预想的都近。武汉方面尚未置评，只据说当夜武汉守备司令部的灯亮了一整夜。"
 DWF_news.2.a:0 "刀已出鞘"
 DWF_news.3.t:0 "多玩选出新党魁——协调派掌印"
 DWF_news.3.d:0 "本报乌鲁木齐电：多玩第一次全国代表大会昨日闭幕，协调派候选人当选党魁。投票结果公布时，会场安静了片刻，随后响起的不是欢呼，是掌声——长时间的、有节奏的掌声。新党魁就任第一件事是公示内阁名单：三派都有位置，连竞魁落败的解放派也得了一个兵务部。「会议桌砍掉一条腿，桌子就立不稳。」各方评论认为，协调派的上台意味着多玩将进入建设优先的时代——修水利、办学校、开驿路。商人们连夜把驼队加了一倍。"
 DWF_news.3.a:0 "算盘响了"
 DWF_news.4.t:0 "机器执掌多玩？——雷石东当选党魁震动全大陆"
 DWF_news.4.d:0 "本报乌鲁木齐电：多玩第一次全国代表大会闭幕，红石派候选人「雷石东1.0」当选党魁——一具诞生于红石工程院的机体。这是这个世界历史上第一次，一个非人类执掌国政。投票仍在人类代表手中进行，结果却是压倒性的。雷石东的就职广播全文二百一十四字，播了三分钟，其中四十秒是散热扇的声音。次日各国来电询问最多的不是政见，是一个问题：「它是认真的吗？」红石工程院的回电只有一句：它的每一票都算过三遍。武汉的报纸用了整版标题：《当机器开始开会》。"
 DWF_news.4.a:0 "当机器开始开会"
 DWF_news.5.t:0 "新话时代？——共同体派掌印多玩"
 DWF_news.5.d:0 "本报乌鲁木齐电：多玩第一次全国代表大会闭幕，共同体派候选人当选党魁。新党魁就任首日即颁行《简明语汇表（草案）》，宣布将「精简」行政语言：「战争恐惧」合并为「外患」，「不同意见」合并为「杂音」。城乡墙上开始出现新标语。观察家们对多玩的转向意见分裂：有人称之为「秩序的黎明」，有人称之为「字典的黄昏」。本报编辑部收到一封读者来信，只有一句话：请以后用新话写报纸吗？编辑部尚未回复。"
 DWF_news.5.a:0 "字典的黄昏"
 DWF_news.6.t:0 "两千年后，都护府重立西域"
 DWF_news.6.d:0 "本报讯：多玩昨日宣布重设西域都护府，辖天山南北军政事务。授印仪式在风里举行，老将军接印后掂了掂，说：「轻了——两千年前的铜印比这个沉。」史学界人士指出，「都护」之名上一次在西域使用，还是在汉唐。如今这块土地上换的是多玩的旗，但用的是同一个词。有西域耆老带着孙儿去看授印，回来在族里记了一笔：「今日，又见都护。」"
 DWF_news.6.a:0 "又见都护"
 DWF_news.7.t:0 "商路贯通亚洲腹地——驼铃从东响到西"
 DWF_news.7.d:0 "本报讯：随着最后一块界碑在咸海边立定，多玩宣布「亚洲腹地商路」全线贯通。从乌鲁木齐到咸海，驼队走完全程只需四十天，比旧帝国时代快了一半。沿线的驿站、票号、客栈一夜之间全部客满。楼兰集市开市第一单，是个西域商人买东边的钢锭，付的是绿宝石。各国商团闻讯而动，武汉、德里、欧洲的商行都在打电报询问通商章程。有老商人在驿站墙上写了一行字：路通了，人心也要通。"
 DWF_news.7.a:0 "路通了"
 DWF_news.8.t:0 "白山黑水烽火再起——多玩对网易宣战"
 DWF_news.8.d:0 "[急电] 昨日拂晓，多玩最高军政联席会议通过决议，正式对网易宣战。宣战书只有一句话：「白山黑水，本属多玩。」战争爆发的消息传出后，全大陆的报纸都在头版登出了同一张地图——东北亚。军事观察家指出，多玩此次动员规模远超以往，西域都护府的部队已在东调。武汉方面保持沉默。这是帝国分裂以来，四方阵营之间爆发的第一场全面战争。"
 DWF_news.8.a:0 "战争来了"
 DWF_news.9.t:0 "「世界编辑程序」启动——多玩向全世界宣战"
 DWF_news.9.d:0 "[急电] 本报付印前一刻收到最后消息：多玩已启动「世界编辑程序」，对全世界所有现存政权同时宣战。宣战文书由红石终端向各国同步发送，全文只有八个字：「这个世界，该换了。」各国首都连夜灯火通明。这是这个世界的历史上第一次，有国家同时对全世界开战。没有人知道结局，只知道旧的时代在这一夜结束了。"
 DWF_news.9.a:0 "该换了"
 DWF_news.10.t:0 "元老院全面掌权——多玩转入建设时代"
 DWF_news.10.d:0 "本报乌鲁木齐电：多玩政治协商会议日前通过《建设优先总纲》，协调派取得完全主导权。军费被大幅削减，水利、学校、驿路预算翻倍。报纸上「南征」二字的出现频率降到了零，「预算」升到了第一。军令部的将校们沉默地在文件上会签。有评论称：多玩放下了刀，拿起了算盘。也有评论称：放下刀的手，下次拿起来会更快。"
 DWF_news.10.a:0 "拿起算盘"
 DWF_news.11.t:0 "先锋队全面掌权——多玩转入战时体制"
 DWF_news.11.d:0 "本报乌鲁木齐电：多玩政治协商会议日前通过《全面动员令》，解放派取得完全主导权。全国兵工厂三班倒，民兵整编入正规军，南下路条已印好一万份。报纸头版不再是粮价，是敌情通报。有老兵在动员大会上说：手指是东线丢的，账还没算完。武汉方面连夜加固了江防。这个从戈壁里走出来的国家，如今整个国家变成了一支军队。"
 DWF_news.11.a:0 "整个国家是一支军队"
