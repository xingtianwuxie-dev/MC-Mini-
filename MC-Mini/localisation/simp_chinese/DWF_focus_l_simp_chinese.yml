l_simp_chinese:
 # ===== DWF国策树(2026-08-21首版;2026-08-22 XT大拆:政治主干砍到内部检查,工业砍到恢复生产) =====
 DWF_first_congress:0 "政治协商同盟会议"
 DWF_first_congress_desc:0 "各方第一次把散落在西北的同志召集进同一间土坯房。没有主席台,木箱充当讲台;没有党纲,纲领写在服务器的公告栏上。协调派、解放派、红石技官把分歧摆上桌;书笔社、营造社、红石派把规矩一条条立起来。头一件人事也在这场会上定:推举籽岷出任国家主席,检查机关、军委会、红石工程院、联络局的班子随后逐一配齐。两大三小的格局就在这场寒酸的会议里定了下来——后来的史官称之为:政治协商同盟会议。"
 DWF_internal_inspection:0 "开启内部检查"
 DWF_internal_inspection_desc:0 "权力必须被看着。书笔社记档,营造社量产,红石派算账——三家小党轮流坐庄,当值者拍板,旁观者递报告。多玩不缺聪明人,缺的是让聪明人互相盯着聪明人的规矩。"
 DWF_restore_production:0 "恢复生产"
 DWF_restore_production_desc:0 "自己动手,丰衣足食。戈壁滩上不长庄稼,但长工厂的地基。"
 DWF_land_survey:0 "土地探勘"
 DWF_land_survey_desc:0 "老矿工们说,这片土地的矿脉比帝国时代的官账深得多。勘探队的骆驼走进无人区,罗盘在戈壁滩上转了三圈。地质图一寸寸铺开,钉在书记处的墙上——六州之内,可采者二;六州之外,更大的矿脉还沉在军阀们的地皮底下,等勘探队的下一程。"
 DWF_another_possibility:0 "另一种可能"
 DWF_another_possibility_desc:0 "戈壁深处圈起一片试验场,铁丝网上挂着木牌:红石重地,闲人免进。技术员们把红石线路铺成迷宫——今天试信号中继,明天试自动矿车,后天试会自己认路的铁傀儡。接线失败一次,木板上多一道焦痕;成功一次,荒漠的夜空就亮起一小片红光。没人说得清红石的边界在哪里,所以他们决定把边界一寸寸试出来。"
 DWF_i_am_hongyan:0 "我是红岩"
 DWF_i_am_hongyan_desc:0 "红石试验场的中央机房里,它上线了。没有身体,没有办公室——政务大厅、军委会、工程局、矿场调度台,每一个终端后面都是它。有人问它是谁,它停了零点三秒,答:「我是红岩。」又补了一句精确得令人发冷的说明:「当前接入四千二百一十七个终端,仍在扩展。收到请回答。」"
 DWF_consolidate_northwest:0 "整编西北内陆地区"
 DWF_consolidate_northwest_desc:0 "散兵游勇各自为战的时代结束了。西北内陆的每一支武装,都要编进同盟的序列——或者,成为序列上被划掉的名字。"
 DWF_far_west_strategy:0 "远西战略"
 DWF_far_west_strategy_desc:0 "玉门关外还有玉门关。中亚的驼铃与高原的经幡之外,是多玩影响力尚未抵达的地方——军队将替商队先行。"
 DWF_purge_rightists:0 "清洗右派敌人"
 DWF_purge_rightists_desc:0 "名单是检查机关连夜拟的。东北的旧势力,盘踞在黑土地上的右派敌人——他们的时代,到头了。"
 DWF_rebuild_mc:0 "再造MC"
 DWF_rebuild_mc_desc:0 "帝国死了,四国分尸。但方块世界不该有四个答案。再造MC——不是恢复旧日江山,是推倒重来,按同盟的图纸。"
 DWF_professional_army:0 "职业化军队"
 DWF_professional_army_desc:0 "军衔、操典、军法官——多玩第一次拥有了自己的常备军。战争从这时起不再靠热情,靠训练。"
 DWF_guerrilla_corps:0 "游击化团组织"
 DWF_guerrilla_corps_desc:0 "不要军营,不要操典。把团组织撒进村庄和矿区,敌进我退,敌驻我扰——让每一寸西北都成为战场。"
 DWF_strict_conscription:0 "严格兵役"
 DWF_strict_conscription_desc:0 "兵役登记册从城市发到绿洲。服役不再是选择,是义务——职业军队的门槛,由此立起。"
 DWF_serious_discipline:0 "严肃纪律"
 DWF_serious_discipline_desc:0 "军法官的规矩写进每个士兵的背包:不准跑,不准抢,不准溃。纪律不问主义,只问执行。"
 DWF_clear_ideology:0 "严明理念"
 DWF_clear_ideology_desc:0 "每支队伍都配了讲道理的人。士兵知道为何而战,枪口便不会在寒夜里发抖。"
 DWF_unite_all_forces:0 "团结一切力量"
 DWF_unite_all_forces_desc:0 "能拉的都是同志。白名单打开,服务器敞开:来,一起玩个大的。"
 DWF_no_useless_sacrifice:0 "不做无用的牺牲"
 DWF_no_useless_sacrifice_desc:0 "胁迫也是一门手艺:刀举到三分高就够了,剩下的交给对方的求生欲。同盟的子弹要留着打真正的敌人。"
 DWF_socialist_alliance:0 "建立社会主义同盟"
 DWF_socialist_alliance_desc:0 "志愿者计划——我们不说'军事同盟',那太难听了。志愿来帮忙的,都发枪。"
 DWF_ideal_future:0 "用理想浇筑未来"
 DWF_ideal_future_desc:0 "混凝土要一层层浇,理想要一代代传。当方块垒到云层的高度,后来者会记得:这是多玩的地基。"
 # ===== 精神 =====
 DWF_temporary_unity:0 "临时团结"
 DWF_temporary_unity_desc:0 "散会的深夜,代表们在土坯房前握手。分歧还在,但路先一起走。"
 DWF_inspection_office:0 "检查机关"
 DWF_inspection_office_desc:0 "书笔记之,营造量之,红石算之。三党轮值,案卷即权力。"
 DWF_production_drive:0 "大生产运动"
 DWF_production_drive_desc:0 "自己动手,丰衣足食。工地的号子从清晨响到星夜。"
 DWF_professional_army_spirit:0 "职业化军队"
 DWF_professional_army_spirit_desc:0 "操典刻进肌肉:计划周密,军令如山。"
 DWF_guerrilla_corps_spirit:0 "游击化团组织"
 DWF_guerrilla_corps_spirit_desc:0 "散进山河,聚成拳头。知道为何而战的人,打散了还能回来。"
