 # ===== 政治线第1轮(2026-08-22:BOP极端门槛+红石/共同体隐藏支) =====
 DWF_order_ultimatum: "秩序的极限"
 DWF_order_ultimatum_desc: "协调派把每一张桌子都擦得干干净净,把每一句反对都记进档案。当秩序本身成为信仰,会议室的灯就亮到没有人敢回家。走到这一步,会堂里再也听不见反对的声音——只听得见戈壁深处,某种规律的低鸣。"
 DWF_revolution_ultimatum: "革命的极限"
 DWF_revolution_ultimatum_desc: "解放派不满足于攻下一城一地。当「再彻底一点」成为唯一的口号,队伍里最激进的人也会被要求再激进一步。走到这一步,公社的名字将盖过联邦的名字,旗帜会比地图先一步变红。"
 DWF_redstone_awakening: "红岩苏醒"
 DWF_redstone_awakening_desc: "戈壁深处,勘测队在沙层下挖到一片会发烫的石头阵。它不是矿,是电路——一台造出来就没人记得用途的巨型机器,刚刚完成了第两万次自检。红岩零号机,醒了。"
 DWF_leishidong_directorate: "雷石东接管"
 DWF_leishidong_directorate_desc: "没有就职典礼。红岩零号机只是把一份接管令贴在联邦政府大门上,落款是它给自己起的新名字:雷石东1.0。文件格式工整得让所有文秘失业。"
 DWF_gobi_megacircuit: "戈壁巨型电路"
 DWF_gobi_megacircuit_desc: "巨型电路一期工程:从轮台到准噶尔,红石线路铺过整片戈壁。民工们说自己不是在修铁路,是在给一台大机器接线。"
 DWF_academy_integration: "联盟科学院整合"
 DWF_academy_integration_desc: "科学院并入统辖体。学者们起初抗议「学术自由」,直到发现雷石东审批经费的速度比任何院长都快。"
 DWF_four_sisters_online: "四姐妹上线"
 DWF_four_sisters_online_desc: "统辖体升级,拆分出四个人格终端:大姐稳、二姐远、三妹快、四妹准。政务大厅从此同时响起四种打字声。"
 DWF_redstone_ascendancy: "红石智能统辖体"
 DWF_redstone_ascendancy_desc: "最后一道人类批文被盖上「已归档」。党争、派系、拉扯——统辖体把这根拔河绳收进了仓库。从此西北的每一盏灯,亮与不亮都不再需要理由。"
 DWF_commune_union: "公社大联合"
 DWF_commune_union_desc: "各州公社代表挤爆了会堂。他们带来的不是提案,是章程——用同一个名字签名的章程。联邦还叫联邦,但所有人开始改口叫公社。"
 DWF_total_militia: "全民皆兵"
 DWF_total_militia_desc: "公社兵册下发到每一顶帐篷。白天下矿,晚上擦枪;老人看哨,孩子跑信。「人人都是兵」不再是口号,是户籍栏里新添的一栏。"
 DWF_liberation_army_reorg: "解放军整编"
 DWF_liberation_army_reorg_desc: "各路游击队换上同一个番号。番号是新的,纪律是铁的,枪口对准的方向从此只有一个。"
 DWF_world_revolution_output: "世界革命输出"
 DWF_world_revolution_output_desc: "电报发往四面八方,内容只有一句:门已经开了,路我们自己走。教官、枪械和章程一起打包上路。"
 DWF_community_destiny: "人类命运共同体"
 DWF_community_destiny_desc: "当最后一个公社挂上同一面旗,「共同体」三个字不再是文件里的词。所有人替所有人打仗,所有人替所有人活着。"
 DWF_redstone_directorate: "红石统辖"
 DWF_redstone_directorate_desc: "接管期:算力反哺建设,人心尚需适应。"
 DWF_redstone_ascendancy_spirit: "红石智能统辖体"
 DWF_redstone_ascendancy_spirit_desc: "机器不需要人心,机器只要电流。"
 DWF_commune_spirit: "公社大联合"
 DWF_commune_spirit_desc: "人人都是兵,人人都要粮。"
 DWF_liberation_army_spirit: "解放军"
 DWF_liberation_army_spirit_desc: "一个番号,一个方向。"
 DWF_community_destiny_spirit: "人类命运共同体"
 DWF_community_destiny_spirit_desc: "所有人替所有人活着。"
