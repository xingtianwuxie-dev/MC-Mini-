# ==== 2026-08-24 工业线:土地改革三路线+资源利用 ====
 DWF_land_reform:0 "土地改革"
 DWF_land_reform_desc:0 "耕者有其田。地契在书记处的院子里烧了一夜,火光照着旧佃户们的脸——有人攥着新发的地照不敢信,有人连夜去量自家那三分地。生产队的账本从这天起换了一种记法。"
 DWF_resource_utilization:0 "加强资源利用"
 DWF_resource_utilization_desc:0 "探勘队的骆驼回来了,驮着半麻袋矿石和一摞地质图。图纸钉上墙,钉子敲进戈壁——新疆都的钢、山里的钨,账面数字一夜之间翻了篇。矿脉不会自己变成炮弹,但人可以。"
 DWF_state_ownership:0 "国有制度"
 DWF_state_ownership_desc:0 "矿山、铁路、红石电路——统统收归国有。计划处的算盘打得噼啪响,一张表格管到底。有人说这是把鸡蛋全放进一个篮子;计划处长说:那就把篮子焊死。"
 DWF_public_ownership:0 "公有制度"
 DWF_public_ownership_desc:0 "工厂归社员,矿坑归矿工,收成记账入社。章程是大家一条条吵出来的,吵完按了手印。合作社的灯亮到半夜——不是加班,是分红算到小数点后两位。"
 DWF_wartime_economy:0 "战时经济体制"
 DWF_wartime_economy_desc:0 "探勘图摊在司令部桌上,和征兵册钉在一起。地底下的矿、地里的人、桌上的账——从今天起全部姓前线。有人问日子还过不过了,军需官头也不抬:过了今天才有日子。"
# ==== 2026-08-24 七线延展到多玩一大 ====
 DWF_congress_preparation:0 "一大筹备处"
 DWF_congress_preparation_desc:0 "开会先得有个开会的地方。检查机关的三小党轮了班搞会务——书笔社拟章程，营造社搭席棚，红石派管扩音。西域中亚各路人马的名额吵了半个月：军队要席位，农会要席位，商队也要席位。戈壁滩上第一次为「谁有资格坐下」这件事，认真地吵了一架。"
 DWF_line_struggle:0 "路线之争"
 DWF_line_struggle_desc:0 "辩论持续了三天三夜。元老们引章程，少壮派拍桌子，商队代表在门外探头。红岩把每一句话都记了档——包括气头上说的和后悔说的。散会时没有结论，但每个人都知道：下一次开会，就该定路线了。"
 DWF_delegate_review:0 "代表资格审查"
 DWF_delegate_review_desc:0 "降将、农会干事、士兵委员、商队账房——名册厚得像砖。红石终端连夜核验，核到每一双手：拿过锄头的，握过枪的，数过钱的，都有一票。有老代表嘀咕：这么查，查到明年也查不完。查完了。机器不需要睡觉。"
 DWF_first_national_congress:0 "多玩第一次全国大会"
 DWF_first_national_congress_desc:0 "戈壁滩上搭起了台子。万旗入会，各族各界，坐了三天三夜的人。籽岷作报告，念到一半放下稿子说：地基打好了，楼是你们的了。会议定下名字——多玩。从这一天起，它不再是一个服务器的名字，是一个国家的名字。"
 DWF_northwest_industrialization:0 "西北工业化"
 DWF_northwest_industrialization_desc:0 "高炉立在乌鲁木齐旧矿区边上，羊圈还没拆。第一炉钢水出来那天，牧民牵着骆驼来看热闹，问这是不是火山。工程师说：比火山好使——火山一年喷一次，它天天喷。"
 DWF_great_rear_base:0 "大后方"
 DWF_great_rear_base_desc:0 "亚洲的心脏地带从此姓多玩。兵工厂三班倒，铁路修到矿口，粮站堆到房梁。前线的士兵知道，枪管后面站着一整个西北——这就是打仗的底气。"
 DWF_frontier_bank:0 "边区票号"
 DWF_frontier_bank_desc:0 "多玩币发行那天，票号门口排队排到街尾。盐税做底，羊毛做押，绿宝石做本位——商人们头一回发现，绿宝石除了跟村民换东西，还能存银行吃利息。军阀区的走私客闻着味就来了：这钱，硬。"
 DWF_unified_purchase_sale:0 "统购统销"
 DWF_unified_purchase_sale_desc:0 "粮棉统购，账本统销。合作社的会计拨了一冬天算盘，把每一笔账记到小数点后两位。有人嫌麻烦，社长说：麻烦才踏实——糊涂账养不出新国家。"
 DWF_trade_circle:0 "贸易圈"
 DWF_trade_circle_desc:0 "楼兰集市重开那天，驼铃从日出响到日落。丝路商队复活了：东边驮着钢和盐，西边驮着羊毛和宝石，路上还有红石信号塔指路。两千年前的路，走着新的人。"
 DWF_redstone_array:0 "红石计算阵列"
 DWF_redstone_array_desc:0 "戈壁滩下的巨型电路通电了。红岩的声音第一次从政务大厅的铜喇叭里出来，算粮账、核名册、排火车皮。有职员嫌它说话直，红岩说：数字不拐弯。"
 DWF_engineering_institute:0 "红石工程院"
 DWF_engineering_institute_desc:0 "工程院挂牌那天没办仪式——机房里第一代新机体正在孵化，嗡嗡作响，像一窝蛋。老工程师隔着玻璃看了很久，说了句：以后的事，就教给它们了。"
 DWF_western_protectorate:0 "西域都护府"
 DWF_western_protectorate_desc:0 "三十六国故地，两千年后重设都护。诏书用红石信号传遍西域，快得让老人不敢信：从前八百里加急跑半个月，现在一炷香。商队跟着信号塔走，驿站跟着商队修。"
 DWF_central_asia_campaign:0 "定远中亚"
 DWF_central_asia_campaign_desc:0 "定远计划收官。沙漠铁路一寸一寸向西爬，爬过咸海，爬到旧地图没画完的地方。界碑立下时，士兵问将军：还往前吗？将军望着西边说：先开会。"
 DWF_heart_of_asia:0 "亚洲腹地"
 DWF_heart_of_asia_desc:0 "亚洲的腹地握在手里了。大会的请柬是骑兵送出去的，一队往东，一队往南。请柬上就一句话：戈壁见。"
 DWF_new_army:0 "多玩新军"
 DWF_new_army_desc:0 "三严整编收口，游击队脱了便衣，老兵换了新枪。授旗那天，军长说：从前我们叫队伍，今天起叫军队。一字之差，差着十年苦功。"
 DWF_redstone_artillery:0 "红石火炮"
 DWF_redstone_artillery_desc:0 "红石信号点火门，发射器阵列齐射——炮兵不再数引线，改数信号灯。靶场老兵看完一轮齐射，半天说了句：这玩意儿比我脾气还急。"
 DWF_enchanted_arms:0 "附魔军械"
 DWF_enchanted_arms_desc:0 "附魔台进了兵工厂，锋利Ⅲ上了刺刀，耐久Ⅲ镀了枪管。军械师给每支枪附完魔都拍一下，像给马装蹄铁。新兵问灵不灵，老兵说：灵不灵不知道，反正更贵了。"
 DWF_automated_arsenal:0 "自动化军工"
 DWF_automated_arsenal_desc:0 "刷铁机的原理搬进了兵工厂：原料进，成品出，流水线昼夜不停。老工匠起初骂机器抢饭碗，三个月后改口：它抢的是夜班，功劳簿上得给它记一笔。"
 DWF_western_good_neighborhood:0 "西线睦邻"
 DWF_western_good_neighborhood_desc:0 "睦邻文书用三种文字写就，盖了章，换了酒。西域中亚的新邻居们发现，这个新政权不一样——先签的是商约，后签的才是军约。"
 DWF_delegates_to_dwf:0 "各族代表进疆"
 DWF_delegates_to_dwf_desc:0 "各族各界代表穿越戈壁赴会：有骑马来的，有坐火车来的，商队代表赶着骆驼来的。乌鲁木齐的客栈住满了，街上飘着十几种语言的讨价还价声——都是冲着大会来的。"
 DWF_congress_spirit:0 "一大决议"
 DWF_liberation_caucus:0 "解放派主政"
 DWF_coordination_caucus:0 "协调派主政"
 DWF_redstone_caucus:0 "红石派主政"
 DWF_collective_caucus:0 "共同体派主政"
