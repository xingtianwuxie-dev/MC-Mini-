l_simp_chinese:
 # ===== 分类 =====
 DWF_military_operations:0 "同盟军事行动"
 DWF_military_operations_desc:0 "军事线国策授予的开战权限。何时拉栓，由同盟书记处自行斟酌——但每一份宣战书都要用检查机关的印章。"
 DWF_diplomatic_absorption:0 "外交吸纳"
 DWF_diplomatic_absorption_desc:0 "对西北近邻军阀的两手：白名单里请进来的，是同志；问罪刀下按进来的，是附庸。"
 DWF_demon_court:0 "拉拢魔族"
 DWF_demon_court_desc:0 "魔族五国与末地王庭的态度，是未来那场大战的门票。持续不断地示好，直到他们自愿走进志愿者计划。"
 # ===== 军事行动 =====
 DWF_thirty_six_kingdoms:0 "三十六国计划"
 DWF_thirty_six_kingdoms_desc:0 "两千年前的班超带着三十六个人平定西域；今天的同盟只需要一份计划书。楼兰、武威、党项——西域三十六国的故地，将重新写上多玩的名字。"
 DWF_thirty_six_kingdoms_tt:0 "向所有§Y西北近邻军阀§!宣战！"
 DWF_dingyuan_plan:0 "定远计划"
 DWF_dingyuan_plan_desc:0 "投笔从戎的故事讲了千年，这次换多玩人来写。驼铃摇过葱岭，中亚的军阀们将见识新时代的定远侯。"
 DWF_dingyuan_plan_tt:0 "向所有§Y中亚军阀§!宣战！"
 DWF_roof_offensive:0 "屋脊攻势"
 DWF_roof_offensive_desc:0 "世界屋脊上的经幡千年不动，但山口终会被人踩出路来。高原之上，同盟的旗要插得比鹰还高。"
 DWF_roof_offensive_tt:0 "向所有§Y西藏军阀§!宣战！"
 DWF_baishan_heishui_offensive:0 "白山黑水攻势"
 DWF_baishan_heishui_offensive_desc:0 "白山黑水之间，盘踞着右派敌人的最后本钱。清洗名单已经拟好，第一页写着东北的军阀，第二页写着网易。"
 DWF_baishan_heishui_offensive_tt:0 "向§Y东北军阀§!与§Y网易§!宣战！"
 DWF_world_edit_program:0 "世界编辑计划"
 DWF_world_edit_program_desc:0 "//选区:全部 //操作:删除旧世界,粘贴新世界。再造MC的最后一个指令，由多玩亲手敲下回车。"
 DWF_world_edit_program_tt:0 "向§Y所有尚存且未入盟§!的国家宣战！"
 # ===== 外交吸纳 =====
 DWF_whitelist_plan:0 "白名单计划"
 DWF_whitelist_plan_desc:0 "服务器白名单打开一条缝：来，登个记，分块地，就是自己人了。不用交投名状——多玩相信人心是可以焐热的。"
 DWF_questioning_offensive:0 "问罪攻势"
 DWF_questioning_offensive_desc:0 "刀举到三分高就够了。罪状念完，让对方自己选：是跪着进同盟，还是躺着出史书。不做无用的牺牲——子弹留着打真正的敌人。"
 # ===== 拉拢魔族(六成入盟;微软版四成) =====
 DWF_court_HIM:0 "拉拢：下界要塞"
 DWF_court_HIM_desc:0 "恐惧魔王的要塞不缺武力，缺的是被旧帝国承认的体面。多玩的使节带着尊重与红石零件走下地狱门。"
 DWF_court_HIM_tt:0 "多玩在§Y下界要塞§!的影响力§G[?global.DWF_influence_HIM_var|%]§!（+5%）"
 DWF_invite_HIM:0 "邀入同盟：下界要塞"
 DWF_invite_HIM_desc:0 "影响力已足，恐惧魔王对旧帝国的怨气可以为我所用。递上志愿书吧——下界的烈焰，将烧向多玩的敌人。"
 DWF_court_GWG:0 "拉拢：洞穴聚落"
 DWF_court_GWG_desc:0 "洞穴里的邻居怕光，也怕再来一次'处置'。多玩送去的是不进洞的承诺，和成箱的胡萝卜。"
 DWF_court_GWG_tt:0 "多玩在§Y洞穴聚落§!的影响力§G[?global.DWF_influence_GWG_var|%]§!（+5%）"
 DWF_invite_GWG:0 "邀入同盟：洞穴聚落"
 DWF_invite_GWG_desc:0 "总督方正茂在洞口签了字。僵尸议会第一次承认：地面上的太阳，也可以是自己的太阳。"
 DWF_court_ZLG:0 "拉拢：猪灵堡垒"
 DWF_court_ZLG_desc:0 "猪灵只认金子——幸好，同盟的金库里不缺这个。每一次交易都是一次交心，反正猪灵分不清两者的区别。"
 DWF_court_ZLG_tt:0 "多玩在§Y猪灵堡垒§!的影响力§G[?global.DWF_influence_ZLG_var|%]§!（+5%）"
 DWF_invite_ZLG:0 "邀入同盟：猪灵堡垒"
 DWF_invite_ZLG_desc:0 "远古猪灵收下了金锭，也收下了盟约。堡垒的门为志愿者计划敞开——以物易物，以盟易命。"
 DWF_court_XWY:0 "拉拢：玄武岩城邦"
 DWF_court_XWY_desc:0 "岩浆怪的议会烧不坏账本，他们只想知道同盟的信誉成色几何。那就让他们算——红石派最不缺的就是算力。"
 DWF_court_XWY_tt:0 "多玩在§Y玄武岩城邦§!的影响力§G[?global.DWF_influence_XWY_var|%]§!（+5%）"
 DWF_invite_XWY:0 "邀入同盟：玄武岩城邦"
 DWF_invite_XWY_desc:0 "账目两清，信誉十足。玄武岩议会投票通过：加入志愿者计划，岩浆与红石从此同炉。"
 DWF_court_LLL:0 "拉拢：林地府邸"
 DWF_court_LLL_desc:0 "唤魔者议会不信任任何活物——但多玩的使节已经第三次活着走出了府邸大门。这本身就是一种说服。"
 DWF_court_LLL_tt:0 "多玩在§Y林地府邸§!的影响力§G[?global.DWF_influence_LLL_var|%]§!（+5%）"
 DWF_invite_LLL:0 "邀入同盟：林地府邸"
 DWF_invite_LLL_desc:0 "奇厄教主收起了咒符。林地府邸的阴影将笼罩多玩的敌人——自觉地，志愿地。"
 DWF_court_MDG:0 "拉拢：末影王庭"
 DWF_court_MDG_desc:0 "末影人不看使者，只看珍珠——那一颗颗瞬移千里的诚意。王庭的沉默有多深，同盟的耐心就有多久。"
 DWF_court_MDG_tt:0 "多玩在§Y末影王庭§!的影响力§G[?global.DWF_influence_MDG_var|%]§!（+5%）"
 DWF_invite_MDG:0 "邀入同盟：末影王庭"
 DWF_invite_MDG_desc:0 "末影龙的注视落在盟约上。终末之地的王庭加入了志愿者计划——世界的尽头，从此也是同盟的边界。"
 # ===== 矿物发掘(2026-08-22 XT定:土地探勘解锁,收复区域扩展) =====
 DWF_mineral_prospecting:0 "矿物发掘"
 DWF_mineral_prospecting_desc:0 "土地探勘铺开的矿脉图挂在书记处的墙上。六州之内，可采者二；六州之外，更大的矿脉沉在军阀们的地皮底下——每收复一片区域，勘探队就向前再走一程。"
 DWF_develop_beiting_oil:0 "发掘：北庭油田"
 DWF_develop_beiting_oil_desc:0 "钻塔竖起的那天，准噶尔的风都是油味。老钻工们赌咒说这底下是个油海——第一口井喷出来的时候，没人再赌了。"
 DWF_develop_beiting_oil_tt:0 "§Y北庭§!：石油§G+12§!，建筑槽§G+1§!"
 DWF_develop_jingtieshan_iron:0 "发掘：镜铁山铁矿"
 DWF_develop_jingtieshan_iron_desc:0 "祁连山把一整座铁矿藏在雪线底下，山岩黑得发亮，像一面镜子。矿工们叫它镜铁山——多玩的第一炉钢，将从这面镜子里走出来。"
 DWF_develop_jingtieshan_iron_tt:0 "§Y酒泉§!：钢铁§G+10§!，建筑槽§G+1§!"
 DWF_develop_chaidamu_oil:0 "发掘：柴达木油气"
 DWF_develop_chaidamu_oil_desc:0 "蒙古语里，柴达木是「盐泽」。盐壳下面锁着气与油——西北军阀没来得及开采就被赶下了台，勘探队接管盐湖时，井架的木料还是新的。"
 DWF_develop_chaidamu_oil_tt:0 "§Y柴达木§!：石油§G+10§!，建筑槽§G+1§!"
 DWF_develop_baiyunebo_mine:0 "发掘：白云鄂博矿"
 DWF_develop_baiyunebo_mine_desc:0 "蒙古语里，白云鄂博是「富饶的神山」。羊倌们早就发现这座山的石头会吸磁石——收复河套之后，多玩把这座神山划进了矿册。"
 DWF_develop_baiyunebo_mine_tt:0 "§Y河套§!：钢铁§G+10§!，建筑槽§G+1§!"
 DWF_develop_yumen_oil:0 "发掘：玉门油田"
 DWF_develop_yumen_oil_desc:0 "祁连山北麓，石油河畔的老君庙。第一口井是工人们自己挖的浅坑，油苗混着河水往外渗。没人想到这个荒滩日后会被写进教科书——中国石油工业的第一页，从这里翻开的。运输靠骆驼，炼塔靠人拉，玉门的油灯先亮了。"
 DWF_develop_yumen_oil_tt:0 "§Y陇西§!：石油§G+10§!，建筑槽§G+1§!"
 DWF_develop_jinchuan_nickel:0 "发掘：金川镍矿"
 DWF_develop_jinchuan_nickel_desc:0 "龙首山下，一块泛着锈绿的矿石砸开了镍都的大门。镍不直接铸剑——它钻进每一炉合金钢里，让炮管更韧、装甲更硬。冶金工程师们说：看不见的金属，往往撑着看得见的战争。"
 DWF_develop_jinchuan_nickel_tt:0 "§Y武威§!：钢铁§G+8§!（镍入合金钢），建筑槽§G+1§!"
 DWF_develop_altai_tungsten:0 "发掘：阿尔泰矿脉"
 DWF_develop_altai_tungsten_desc:0 "金山阿尔泰，突厥语里的「金子」。定远计划打穿了中亚，勘探队跟着兵锋翻过山——金子没找到多少，钨砂倒是铺了一矿带。枪炮要的硬东西，这里都有。"
 DWF_develop_altai_tungsten_tt:0 "§Y阿尔泰§!：钨§G+6§!，建筑槽§G+1§!"
 DWF_develop_karaganda_steel:0 "发掘：卡拉干达矿带"
 DWF_develop_karaganda_steel_desc:0 "草原上的黑色矿带，前人挖了一半就断了手。多玩的矿车开进卡拉干达时，当地老人指着地平线说：这下面的煤和铁，够打三场战争。"
 DWF_develop_karaganda_steel_tt:0 "§Y卡拉干达§!：钢铁§G+8§!，建筑槽§G+1§!"
 DWF_develop_emba_oil:0 "发掘：恩巴油田"
 DWF_develop_emba_oil_desc:0 "乌斯秋尔特高原东缘，恩巴河把盐漠切开一道口子。这里的地皮冒油冒了几百年——比巴库年轻，比谁都倔。钻井队接管盐碱滩时，老井架还立在原地，像一排生锈的界碑：界碑以东，旧帝国的势力到此为止。"
 DWF_develop_emba_oil_tt:0 "§Y乌斯秋尔特§!：石油§G+10§!，建筑槽§G+1§!"
 DWF_develop_dhezkazgan_mine:0 "发掘：杰兹卡兹甘矿城"
 DWF_develop_dhezkazgan_mine_desc:0 "哈萨克语里，杰兹卡兹甘的意思是「挖铜的地方」——地名就是矿册，草原先民早把答案写在了路牌上。铜会说话：线路、弹壳、合金钢，前线要什么，这座矿城就应什么。"
 DWF_develop_dhezkazgan_mine_tt:0 "§Y阿克莫林斯克§!：钢铁§G+8§!，建筑槽§G+1§!"
 DWF_develop_luobusha_chromium:0 "发掘：罗布莎铬矿"
 DWF_develop_luobusha_chromium_desc:0 "屋脊攻势之后，高原向多玩敞开。雅鲁藏布江边的罗布莎山体里嵌着铬——造枪管炮管最馋的硬金属，高原沉默地替多玩存了千年。"
 DWF_develop_luobusha_chromium_tt:0 "§Y藏§!：铬§G+5§!，建筑槽§G+1§!"
 DWF_develop_kang_tungsten:0 "发掘：康区矿脉"
 DWF_develop_kang_tungsten_desc:0 "横断山脉把矿脉折成了千层饼。康区的马帮以前驮茶，现在驮钨砂——山还是那座山，驮的东西换了，时代就换了。"
 DWF_develop_kang_tungsten_tt:0 "§Y康§!：钨§G+5§!，建筑槽§G+1§!"
 DWF_develop_lunpola_oil:0 "发掘：伦坡拉油气"
 DWF_develop_lunpola_oil_desc:0 "藏北羌塘，伦坡拉盆地——海拔四千七百米，世界屋脊上的油田。牧人说湖边黑石头能点灯，勘探队笑着说：那不是灯，是火种。高原给多玩的回礼沉默而贵重：在中国人挑不着担子的地方，先点亮一盏。"
 DWF_develop_lunpola_oil_tt:0 "§Y那曲§!：石油§G+8§!，建筑槽§G+1§!"
 DWF_develop_songnen_oil:0 "发掘：松嫩油田"
 DWF_develop_songnen_oil_desc:0 "白山黑水拿下之后，勘探队在松嫩平原打了三年钻。松基三井喷油那天，泥浆糊了工程师一脸——他在泥浆里笑出了声：东北的黑土底下，流的真是油。"
 DWF_develop_songnen_oil_tt:0 "§Y黑龙江§!：石油§G+12§!，建筑槽§G+1§!"
 DWF_develop_xinganling_iron:0 "发掘：兴安岭铁矿"
 DWF_develop_xinganling_iron_desc:0 "大兴安岭的树密得进不去人，勘探队跟着伐木道往里走。铁矿露头的地方，雪化得比别处早——老猎人说，山里睡着的东西是暖的。"
 DWF_develop_xinganling_iron_tt:0 "§Y奴儿干§!：钢铁§G+8§!，建筑槽§G+1§!"
 DWF_develop_fushun_shale:0 "发掘：抚顺页岩油"
 DWF_develop_fushun_shale_desc:0 "煤层的顶板上压着一层会燃烧的灰石。旧势力钻了十几年深井找油，一无所获，只好把怨气撒在页岩上——干馏炉昼夜不熄。如今炉火换了主人：石头里榨出的每一滴油，都算对旧时代的利息。"
 DWF_develop_fushun_shale_tt:0 "§Y夫余§!：石油§G+8§!，建筑槽§G+1§!"
 DWF_develop_xiao_xinganling_iron:0 "发掘：小兴安岭铁矿"
 DWF_develop_xiao_xinganling_iron_desc:0 "林海深处，运材铁路的尽头藏着赤红的山头。伐木工人最先发现：山皮下面全是铁。锯倒最后一棵遮矿的大树时，老把头说了句实在话——树没了可以再栽，钢铁不吃十年树。"
 DWF_develop_xiao_xinganling_iron_tt:0 "§Y勿吉§!：钢铁§G+8§!，建筑槽§G+1§!"
 # --- 华北组 ---
 DWF_develop_kailuan_iron:0 "发掘：开滦煤铁"
 DWF_develop_kailuan_iron_desc:0 "开平矿务局的旧井架还没倒，新矿车已经轧着铁轨开进冀州。开滦的煤和铁从不分家——一锹下去，乌金和赤铁各半。华北平原的烟囱重新冒烟那天，老工头说了句：炉子没凉过，只是换了烧火的人。"
 DWF_develop_kailuan_iron_tt:0 "§Y冀州§!：钢铁§G+12§!，建筑槽§G+2§!"
 DWF_develop_datong_coal:0 "发掘：大同煤矿"
 DWF_develop_datong_coal_desc:0 "雁门关外、桑干河畔，大同的煤层厚得像翻开了地壳的封面。矿坑一层一层往下走，越走越黑，越黑越暖——这座城什么都缺，就是不缺烧的。工业区的新厂房还没封顶，煤堆已经比围墙高了。"
 DWF_develop_datong_coal_tt:0 "§Y常山§!：建筑槽§G+3§!（煤转工业产能）"
 DWF_develop_zhongyuan_oil:0 "发掘：中原油田"
 DWF_develop_zhongyuan_oil_desc:0 "黄河故道两岸，盐碱地底下藏着油。第一口探井出来的不是油——是气，烧了半天才安静。第二口出了油花，第三口喷了满井台。勘探队长在日志上只写了四个字：「中原有油」。"
 DWF_develop_zhongyuan_oil_tt:0 "§Y济南§!：石油§G+10§!，建筑槽§G+1§!"
 # --- 华东组 ---
 DWF_develop_maanshan_iron:0 "发掘：马鞍山铁矿"
 DWF_develop_maanshan_iron_desc:0 "长江南岸，两座山头像马鞍扣在地上——名字就这么来的。山体剖开全是赤铁矿，品位高得冶炼厂不用选矿直接进炉。江南从此有了自己的钢铁：不必再从北方运一根钉子。"
 DWF_develop_maanshan_iron_tt:0 "§Y庐江§!：钢铁§G+12§!，建筑槽§G+1§!"
 DWF_develop_shengli_oil:0 "发掘：胜利油田"
 DWF_develop_shengli_oil_desc:0 "黄河入海口的盐碱滩上，钻机日夜不停。第一口自喷井喷出来的油是黑的，井场的人全变成了泥人——但泥人们在笑。齐郡的海风里从此带着石油味，渔民说鱼都肥了三分。"
 DWF_develop_shengli_oil_tt:0 "§Y齐郡§!：石油§G+12§!，建筑槽§G+1§!"
 DWF_develop_changxing_coal:0 "发掘：长兴煤铁"
 DWF_develop_changxing_coal_desc:0 "太湖南岸的丘陵里，竟然埋着江南最大的煤田。旧时代的士绅嫌煤脏不肯开采，如今矿车碾过茶园，茶农倒不心疼——他们说：茶叶能换的铁，比这一季的收成多。"
 DWF_develop_changxing_coal_tt:0 "§Y吴郡§!：钢铁§G+6§!，建筑槽§G+2§!"
 # --- 华南组 ---
 DWF_develop_shuikoushan_tungsten:0 "发掘：水口山矿务"
 DWF_develop_shuikoushan_tungsten_desc:0 "湘南衡阳，水口山的矿洞比县志还老。铅锌钨三样东西搅在一起往外冒，选矿是门手艺——老师傅的眼睛比化验室准。军工厂要的钨砂，从这条矿脉里一筐一筐背出来，背夫的肩膀比扁担还硬。"
 DWF_develop_shuikoushan_tungsten_tt:0 "§Y长沙§!：钨§G+8§!，建筑槽§G+1§!"
 DWF_develop_dexing_copper:0 "发掘：德兴铜矿"
 DWF_develop_dexing_copper_desc:0 "赣东北的山坳里，露天矿坑像个巨碗——亚洲最大的铜矿，从宋朝挖到现在还没见底。铜水入炉变成合金钢板，从江西的山里一路流到前线的装甲车间。德兴人说：我们的山是空心的，全是铜。"
 DWF_develop_dexing_copper_tt:0 "§Y豫章§!：钢铁§G+8§!，建筑槽§G+1§!"
 DWF_develop_gejiu_tin:0 "发掘：个旧锡矿"
 DWF_develop_gejiu_tin_desc:0 "滇南个旧，世界锡都——锡矿从明朝采到现在，矿洞能通到越南。锡是稀有金属之母：焊料、合金、镀层，什么都离不开它。矿车从红河谷一路拉到冶炼厂，炉温日夜不降。"
 DWF_develop_gejiu_tin_tt:0 "§Y桂州§!：铬§G+8§!（稀有金属），建筑槽§G+1§!"
 # --- 西南组 ---
 DWF_develop_panzhihua_iron:0 "发掘：攀枝花钒钛矿"
 DWF_develop_panzhihua_iron_desc:0 "金沙江畔，攀枝花——中国最大的钒钛磁铁矿，储量够全国吃一百年。山太陡、路太险，旧帝国从没动过它的心思。如今铁路修进大裂谷，矿石顺着传送带日夜往下走。冶金专家说：这里的铁不是普通铁，它带着钒和钛——出来就是特种钢。"
 DWF_develop_panzhihua_iron_tt:0 "§Y益州§!：钢铁§G+14§!，建筑槽§G+2§!"
 DWF_develop_zigong_gas:0 "发掘：自贡天然气"
 DWF_develop_zigong_gas_desc:0 "自贡的盐井两千年前就在冒气——卤水煮盐时，井口蹿出的蓝火把灶头都烧穿了。如今盐井改了名叫气井，天然气顺着管道送进化工厂和发电机。蜀地的地底下，藏着不止一个时代的燃料。"
 DWF_develop_zigong_gas_tt:0 "§Y巴郡§!：石油§G+8§!（天然气折算），建筑槽§G+1§!"
 DWF_develop_huili_copper:0 "发掘：会理铜矿"
 DWF_develop_huili_copper_desc:0 "川西大凉山，会理铜带绵延百里。彝族老矿工世代在这里背矿石下山，如今换成了矿车和索道。铜入合金钢，一吨铜顶三吨铁——大凉山的路虽然难走，但走出来的每一车都值三倍的价。"
 DWF_develop_huili_copper_tt:0 "§Y越嶲§!：钢铁§G+8§!，建筑槽§G+1§!"
