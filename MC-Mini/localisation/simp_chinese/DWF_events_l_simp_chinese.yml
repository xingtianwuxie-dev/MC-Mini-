l_simp_chinese:
 # ===== DWF 中央大会·重要职位任命(2026-08-21 XT定) =====
 DWF.1.t:0 "政治协商同盟会议·推举国家主席"
 DWF.1.desc:0 "政治协商同盟会议散会前,最后一项议程推到了籽岷面前:出任国家主席。满堂代表举手表决——第一次人事,由政治协商同盟会议定。籽岷没有长篇大论,只向代表们深深一揖:『同志们辛苦了。路还长,咱们一起慢慢走。』——任命书上的第一行,写的是他的名字,落款是全体代表。"
 DWF.1.a:0 "籽岷同志,辛苦了。从此中央有人坐镇。"
 DWF.1.b:0 "先记下。机关班子随后几日当场配齐。"
 DWF.2.t:0 "中央大会·检查机关轮值"
 DWF.2.desc:0 "政治协商同盟会议进入第二程:国家主席已定,中央机关班子当场配齐——头一项,检查机关当值人选。书笔社、营造社、红石派,三家小党各呈履职报告:谁当值,谁决定未来一年盯的是账本、图纸,还是算力。"
 DWF.2.a:0 "书笔社当值。笔杆子盯着每一笔账。"
 DWF.2.b:0 "营造社当值。卷尺量过每一处工地。"
 DWF.2.c:0 "红石派当值。红石信号替我们数清每一块矿。"
 DWF.3.t:0 "中央大会·军委会主任任命"
 DWF.3.desc:0 "第二项议程:同盟军事委员会主任。基岩元帅的履历压身——边防二十年,守土无失。军令如山,这个名字写上去,无人反对。"
 DWF.3.a:0 "基岩元帅,军令如山。"
 DWF.3.b:0 "先代行,操练起来。"
 DWF.4.t:0 "中央大会·红石工程院院长任命"
 DWF.4.desc:0 "第三项议程:红石工程院院长。马库斯·红石的图纸已经替同盟修好了三座矿车轨道,红石灯在地底亮成一条长河。院长之位,当仁不让。"
 DWF.4.a:0 "马库斯,图纸即兵符。"
 DWF.4.b:0 "给他配个研究院,图纸多画几张。"
 DWF.5.t:0 "中央大会·联络局长任命"
 DWF.5.desc:0 "这届大会最后一项议程:联络局——同盟对外的门面。白名单上的同志、问罪刀下的附庸,都要从这里进出。人选由中央大会提名,待大会表决。"
 DWF.5.a:0 "人选留待下次大会。先把摊子搭起来。"
 DWF.5.b:0 "暂由籽岷代管。"

 # ===== 政治线第1轮事件(2026-08-22) =====
 DWF.10.t: "协调·绝对"
 DWF.10.d: "会议记录越来越厚,反对意见越来越短。当协调派赢得第七次全体表决,会堂里响起的不是欢呼,是收拾文件的声音——所有人都知道,接下来该轮到不在场的人不安了。"
 DWF.10.a: "秩序井然"
 DWF.11.t: "解放·绝对"
 DWF.11.d: "街垒拆了又搭,口号喊哑了换人喊。当解放派在代表大会上清点出席人数,发现反对者一个都没来——不是不想来,是已经学会了不反对。"
 DWF.11.a: "全面动员"

 # ===== DWF.15 跳测事件(2026-08-22,控制台专用) =====
 DWF.15.t: "测试:政治线快跳"
 DWF.15.d: "控制台测试事件。A:完成「政治协商同盟会议」;B:完成「开启内部检查」;C:BOP归零。"
 DWF.15.a: "完成政协会议"
 DWF.15.b: "完成内部检查"
 DWF.15.c: "重置BOP"



 # ===== 开局介绍事件链(2026-08-23 XT定:TFR式翻页,声明独占一页) =====
 DWF.101.t:0 "欢迎来到「沙盒世纪」"
 DWF.101.desc:0 "欢迎加入《MC-Mini》的同人世界！本MOD是以《钢铁雄心IV》为基础制作的架空历史扩展，由作者团队倾力打造。开局之前，不妨先看看以下内容——署名与致谢，各国处境定位，以及一则必须先行阅读的作者声明。以下内容可随时返回本页往返翻阅，在最后一页选择「开始游戏」即可正式开局。"
 DWF.101.a:0 "署名与致谢"
 DWF.101.b:0 "各国处境定位"
 DWF.101.c:0 "作者立场声明"
 DWF.101.d:0 "开始游戏（已读完）"

 DWF.102.t:0 "署名与致谢"
 DWF.102.desc:0 "《MC-Mini》·「沙盒世纪」，版本 0.0.3。本MOD由作者团队以学习与交流为目的制作，属非官方同人创作，与 Mojang、微软、网易等任何公司均无隶属关系。感谢每一位关注与支持本MOD的朋友：感谢《钢铁雄心IV》及其MOD社区（TFR等）提供的灵感与机制参考，感谢为世界观、美术、本地化与测试倾注心力的协作者们。这是我们一起搭建的沙盒——愿你在其中尽情建造，尽情想象。本页可在主菜单点击「署名与致谢」随时返回。"
 DWF.102.a:0 "返回主菜单"

 DWF.103.t:0 "作者立场声明"
 DWF.103.desc:0 "在开始游戏之前，请先阅读以下声明。一、本MOD作者坚决拥护中国共产党的领导，坚决维护党中央权威和集中统一领导，深入学习贯彻习近平新时代中国特色社会主义思想，坚持走中国特色社会主义道路，坚持中国特色社会主义制度，增强「四个意识」、坚定「四个自信」、做到「两个维护」。二、本MOD《MC-Mini》是基于游戏《钢铁雄心IV》(Hearts of Iron IV)制作的非官方同人创作MOD，仅限学习与娱乐交流使用，不用于任何商业用途，不以任何形式牟利。三、本MOD中出现的所有国家、地区、领土、地图边界、政权、事件、人物、组织、口号与剧情，均为虚构创作，不对应也不影射现实世界中任何国家、地区、政权、组织、事件或个人。本MOD所提供的历史框架与叙述，不代表作者及参与者任何现实政治立场、历史观点或价值判断。四、作者郑重声明：坚决维护国家主权和领土完整，完全支持一个中国原则。台湾是中国领土不可分割的一部分，不存在所谓的「台湾国」或「两个中国」。任何在MOD地图或剧情中出现过的相关问题，均属历史游戏机制的虚构演绎，绝不意味着对上述原则的任何背离。五、作者坚决反对任何形式的分裂主义行径，包括但不限于「台独」「藏独」「疆独」「港独」。中华民族是不可分割的整体，中国的每一个省份、自治区与特别行政区都是祖国疆域的一部分。六、如本MOD中任何内容与玩家的现实观念相悖，敬请以本声明为准。欢迎一切善意交流与建议，但请勿将虚构内容与现实政治做不当关联。祝您游戏愉快，谢谢理解与支持。"
 DWF.103.a:0 "返回主菜单"
 DWF.103.b:0 "我已知悉上述声明,并将继续游戏"

 DWF.104.t:0 "各国处境定位"
 DWF.104.desc:0 "在[Root.GetName]，一切刚刚开始：帝国的余晖尚未散尽，各路势力已在暗中重整旗鼓。本MOD的每一位开局势力都站在同一条起跑线上，你选择的政权，将决定未来数年整片大陆的走向——是重振旧日的荣光，是开拓崭新的道路，还是在那片被战争撕开的缝隙里，建立只属于自己的秩序。本页可在主菜单点击「各国处境定位」随时返回；各势力详情亦可于游戏内「国家」面板查看。"
 DWF.104.a:0 "返回主菜单"
 DWF.104.b:0 "开始游戏（已读完）"
# ==== 2026-08-24 七线延展·剧情事件(DWF_story) ====
 DWF_story.701.t:0 "路线之争：元老程序"
 DWF_story.701.desc:0 "元老们赢了。不是靠嗓门，是靠章程——第几条第几款，一条条念下来，念得少壮派没了脾气。散会时老元长舒一口气：慢一点，走得完。"
 DWF_story.701.a:0 "慢一点，走得完"
 DWF_story.702.t:0 "路线之争：少壮决议"
 DWF_story.702.desc:0 "少壮派赢了。拍桌子拍出来的胜利——桌子拍裂了三张，决议通过了七条。散会时年轻的代表们堵在门口喊：明天就发兵！"
 DWF_story.702.a:0 "明天就发兵"
 DWF_story.703.t:0 "路线之争：僵持"
 DWF_story.703.desc:0 "吵到天亮，没有结论。红岩把双方发言一字不落存了档，机器第一次学会沉默。散会时有人说：让它说句话啊。红岩说：这个问题，我没有答案。"
 DWF_story.703.a:0 "记下来，接着吵"
 DWF_story.800.t:0 "多玩第一次全国大会开幕"
 DWF_story.800.desc:0 "万旗入会。戈壁滩上搭了三天的台子，今天坐满了人。籽岷作完报告，把稿子折起来放进口袋：「地基是我打的，楼是你们盖的。」\n\n台下静了三秒，然后是掌声——先是一处，然后是整片。"
 DWF_story.800.a:0 "从今天起，我们叫多玩"
 DWF_story.801.t:0 "第一届多玩全国大会：党魁选举"
 DWF_story.801.desc:0 "籽岷宣布卸任，不再担任任何职务。会场安静得能听见红岩的散热扇。\n\n四派人马对视一眼：该我们了。"
 DWF_story.801.liberation:0 "解放派——「枪杆子已经证明了自己」"
 DWF_story.801.coordination:0 "协调派——「慢一点，走得完」"
 DWF_story.801.redstone:0 "红石派——「让算了一路的机器来算国事」（雷石东1.0）"
 DWF_story.801.collective:0 "共同体派——「一个声音，一个多玩」"
# ==== 2026-08-24 剧情事件链文案 ====
 DWF_story.101.t:0 "第一炉钢"
 DWF_story.101.desc:0 "老赵头在高炉边站了一辈子——旧矿局的炉子，军管的炉子，现在的炉子。退休那天他摸了摸炉壁，烫手，缩回来，笑了：「这炉子有火气，是好炉子。」徒弟问火气是啥，他说：就是有人看着它。"
 DWF_story.101.a:0 "好炉子要有好人看着"
 DWF_story.102.t:0 "夜校"
 DWF_story.102.desc:0 "夜校的女工下了工不回家，趴在窗台上学写字。先生教的第一课不是自己的名字，是「零件」两个字。有人问为啥，先生说：你拧的每颗螺丝，前线都有人等。"
 DWF_story.102.a:0 "螺丝虽小，缺一不可"
 DWF_story.201.t:0 "挤兑风波"
 DWF_story.201.desc:0 "票号开门第三天，有人喊了一嗓子「票子要黄」，队伍当场乱了。红石终端连夜清算，天亮时门口贴出告示：全兑。柜台前排到街尾，没人挤——告示底下站着兵，兵底下压着账，账是明的。"
 DWF_story.201.a:0 "全兑，一分不少"
 DWF_story.201.b:0 "先稳住再说"
 DWF_story.202.t:0 "糊涂账"
 DWF_story.202.desc:0 "统购统销第一年，查出陇西某合作社主任把公粮卖了两回。公审大会上他低着头，台下都是熟人。社长最后发了话：退赔，戴罪管账——账再也糊弄不了机器了，人也别想。"
 DWF_story.202.a:0 "公审示众"
 DWF_story.202.b:0 "退赔戴罪"
 DWF_story.203.t:0 "驼铃入城"
 DWF_story.203.desc:0 "楼兰集市开市第一单，是个西域商人买东边的钢锭，付的是绿宝石。验货的老师傅捏着宝石对太阳看了半天，说：成色好，比银票实在。当天夜里，驼铃进了城，半城人都没睡着——不是吵的，是高兴的。"
 DWF_story.203.a:0 "听，驼铃"
 DWF_story.301.t:0 "铜喇叭之夜"
 DWF_story.301.desc:0 "政务大厅的铜喇叭第一次响，全楼的人都停下来听。念的是粮价——今早的，各地的，精确到厘。有人失望：就这？老科长说：你年轻。念粮价的政权，饿不死人。"
 DWF_story.301.a:0 "记下今日粮价"
 DWF_story.302.t:0 "孵化"
 DWF_story.302.desc:0 "新机体第一次自检通过，机房的散热扇齐齐响了一拍，又齐齐停了。值夜工程师说，那三秒钟的安静，像一窝蛋同时裂了缝。有人问它叫什么名字，没人答得上来——名字的事，留给以后的大会。"
 DWF_story.302.a:0 "留给以后"
 DWF_story.401.t:0 "都护授印"
 DWF_story.401.desc:0 "授印那天风大。老将军接了印，掂了掂，说：轻了——两千年前的铜印比这个沉。副官问刻什么名，将军说：就刻「多玩」，叫后人知道这时候谁在这。"
 DWF_story.401.a:0 "印落西域"
 DWF_story.402.t:0 "界碑"
 DWF_story.402.desc:0 "定远计划的最后一块界碑立在咸海边上。立碑的士兵是当年游击队出身，摸着碑说：当年我们连村口的路都守不住。将军说：所以碑要立得深。"
 DWF_story.402.a:0 "立得深，立得稳"
 DWF_story.403.t:0 "请柬出发"
 DWF_story.403.desc:0 "骑兵队出发那天带着两样东西：请柬和路条。往东的一队走草原，往南的一队走戈壁。请柬上就一句话——戈壁见。路条上盖满了章，每一站都要换马，马比人先到。"
 DWF_story.403.a:0 "戈壁见"
 DWF_story.404.t:0 "旗"
 DWF_story.404.desc:0 "新军的旗是各地合作社凑布缝的——红的是陇西的，黄的是南疆的，边角一块白，是乌鲁木齐哪个学校的学生捐的衬衫。裁缝说这旗不正统。军长说：凑出来的才是我们。"
 DWF_story.404.a:0 "升旗"
 DWF_story.501.t:0 "首轮齐射"
 DWF_story.501.desc:0 "靶场齐射，三十门炮一个信号灯全响。观察员报靶：弹着点密得像筛子。炮兵连长盯着弹坑看了半天，说了句：以前是人等炮，现在是炮等人。"
 DWF_story.501.a:0 "炮等人"
 DWF_story.502.t:0 "拜师"
 DWF_story.502.desc:0 "兵工厂的附魔台前排起了队——不是领枪的，是拜师的。老附魔师收徒只问一句：手稳不稳？徒手悬腕，滴墨不落，收了。他说：附魔这行，心不稳，附出来的东西也不稳。"
 DWF_story.502.a:0 "心稳，手稳"
 DWF_story.503.t:0 "功劳簿"
 DWF_story.503.desc:0 "年底记功，军工科把一台刷铁机报了上去。审批的人问：机器怎么记功？科长说：记它抢的夜班——三百个通宵，人歇它不歇。批了。功劳簿上头一回有了个编号名字。"
 DWF_story.503.a:0 "给它记一笔"
 DWF_story.601.t:0 "三种酒"
 DWF_story.601.desc:0 "睦邻签约后的那碗酒是兑的：草原的马奶酒，绿洲的葡萄酒，汉地的烧刀子。翻译说兑一起要出事，老兵说酒都兑了，人还能不兑？三碗下去，谁也没醉，谁也没清醒着走。"
 DWF_story.601.a:0 "兑了"
 DWF_story.602.t:0 "客栈"
 DWF_story.602.desc:0 "乌鲁木齐的客栈住满了。掌柜的学会了三种语言的「客满」，第四种是比划。夜里打烊，他在账本上画了个圈：这些话他一个字听不懂，但知道都是来开会的。他把圈画得很圆——像月亮。"
 DWF_story.602.a:0 "都住下吧"
 DWF_story.704.t:0 "名册第一页"
 DWF_story.704.desc:0 "名册核完，第一页第一行是「籽岷」。工作人员请他过目，他拿笔把自己名字划了：「我不占这个名额。」工作人员说章程里有您。他说：「章程是你们定的，我是开会来的——开会的人，不当代表。」"
 DWF_story.704.a:0 "划掉的名字"
 DWF_story.802.t:0 "上任第一天"
 DWF_story.802.desc:0 "新党魁上任第一天没开会，先去了三个地方：机房、靶场、票号。红岩全程陪同记录，晚上出了份报告，标题很短：《还能用》。有人问这是什么意思，新党魁说：意思是——都还能用，包括我。"
 DWF_story.802.a:0 "《还能用》"
