 # ===== 岩石之令·旧五人(2026-08-24,与HJM_旧五人共享译名) =====
 W01_Soren:0 "索伦"
 W01_Gabriel:0 "加百利"
 W01_Magnus:0 "马格奈斯"
 W01_Ellegaard:0 "埃勒加德"
 W01_Ivor:0 "艾弗"
 W01_Soren_desc:0 "索伦，旧岩石之令的缔造者与领袖。曾是MC世界传说中击败末影龙的建筑师，内战起后率旧部在华北另立山头，国号「岩石之令」。"
 W01_Gabriel_desc:0 "加百利，旧岩石之令的勇士。宝刀未老，威名犹在，是华北军阀中最能打的招牌。"
 W01_Magnus_desc:0 "马格奈斯，旧岩石之令的侠盗。行侠仗义，身手矫健，如今把劫富济贫的本事用在了军阀混战里。"
 W01_Ellegaard_desc:0 "埃勒加德，旧岩石之令的红石工程师。图纸上画出过一个时代的奇迹，如今为军阀修城筑垒。"
 W01_Ivor_desc:0 "艾弗，旧岩石之令的药剂师。当年因不愿说谎而离开传说，如今在华北的军营里调配秘药。"
