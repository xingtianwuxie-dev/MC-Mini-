l_simp_chinese:
# ==== 2026-08-24 四派事件链文案(SetA段位拉扯/SetB执政风味/SetC叙事池/SetD补遗) ====

# --- SetA 段位拉扯 ---
 DWF_faction.1.t:0 "夜校传单"
 DWF_faction.1.desc:0 "夜校下课后，长凳底下摸出几十张传单——解放派印的，油墨还新。标题就一行字：「戈壁都拿了，为什么停？」教员把传单收成一摞，送到教务处请示。窗外，最后一拨学生正往家走，有人边走边回头。"
 DWF_faction.1.a:0 "收缴——夜校只教识字"
 DWF_faction.1.b:0 "任其流传"
 DWF_faction.2.t:0 "元老茶会"
 DWF_faction.2.desc:0 "老城根的茶馆包了场——协调派的几位元老聚了一下午，没发通电，没出公告，只在结账时托掌柜带了句话：饭要一口一口吃，路要一里一里修。话很快传到筹备处。"
 DWF_faction.2.a:0 "亲自赴会听训"
 DWF_faction.2.b:0 "婉拒——公务缠身"
 DWF_faction.3.t:0 "先锋队整训"
 DWF_faction.3.desc:0 "伊犁河谷的民兵先锋队自发整训了三个月，没领军饷，没要名义。队列、土工作业、夜间行军，一样不落。队长把请战书送进城来，末尾按了三百个红手印。"
 DWF_faction.3.a:0 "编入正规军序列"
 DWF_faction.3.b:0 "责令解散归农"
 DWF_faction.4.t:0 "圆桌联署"
 DWF_faction.4.desc:0 "各省参事联名递了呈文：请开圆桌会议，把宪章先定下来——「打天下的事急，坐天下的规矩更急」。联署纸接了三页，最后一个签名歪歪扭扭，是个刚学会写自己名字的牧民。"
 DWF_faction.4.a:0 "采纳——择日开圆桌"
 DWF_faction.4.b:0 "压下——先军后政"
 DWF_faction.5.t:0 "南下请愿"
 DWF_faction.5.desc:0 "三百多名老兵在政务厅前静坐请愿，要求「立刻南下，直取网易」。领头的是个断了三根手指的连长，他说：手指是东线丢的，账还没算完。卫兵端来热水，没人喝。"
 DWF_faction.5.a:0 "接见——承诺南征"
 DWF_faction.5.b:0 "劝返——一切等大会"
 DWF_faction.6.t:0 "建设优先案"
 DWF_faction.6.desc:0 "政务院提交《五年建设优先案》：裁两成军费，修水利、办学校、开驿路。财政司长在会上把账本拍在桌上：兵是刀，粮是本——刀再快，不能拿本钱去磨。军令部的人脸色铁青。"
 DWF_faction.6.a:0 "削军费，投建设"
 DWF_faction.6.b:0 "搁置建设案"

# --- SetB 解放派执政 ---
 DWF_faction.11.t:0 "第一次党委会议"
 DWF_faction.11.desc:0 "新党魁上任后第一次党委会议，秘书处把会议室的旧地图取下来，换上全域舆图——从西疆到东海，一张图挂满整面墙。党魁进门第一句话：「从今天起，会议记录里不许再出现『待议』两个字。要么议决，要么撤下。」"
 DWF_faction.11.a:0 "记录在案"
 DWF_faction.12.t:0 "老兵授勋"
 DWF_faction.12.desc:0 "授勋典礼的名单末尾有个名字划了框——东线阵亡的游击队长，追授二等功。党魁亲自去了他家，把勋章别在他母亲胸前。老太太摸着勋章问：值多少钱。党魁说：不值钱，但值一辈子。"
 DWF_faction.12.a:0 "值一辈子"
 DWF_faction.13.t:0 "南下的路条"
 DWF_faction.13.desc:0 "参谋部把南征的路条预先印好了一万份，捆成捆锁进柜子。有人问既然要打，为什么不发下去。党魁把柜门锁上：「路条印好了，不代表今天就走。让每个人都知道路在那——但走不走、哪天走，大会说了算。」"
 DWF_faction.13.a:0 "大会说了算"

# --- SetB 协调派执政 ---
 DWF_faction.21.t:0 "联合内阁"
 DWF_faction.21.desc:0 "内阁名单公示，三派都有位置——连竞魁落败的解放派也得了一个兵务部。有人劝新党魁把对手排挤干净，他说：会议桌砍掉一条腿，桌子就立不稳。名单一字未改，公示三天，无人异议。"
 DWF_faction.21.a:0 "桌子要四条腿"
 DWF_faction.22.t:0 "预算会议"
 DWF_faction.22.desc:0 "预算会议吵到第三天，两派各执一词，谁也说不服谁。最后财政司长把红岩的清算账册抱进来摊开——三年的账，一页页对下来，数字不会吵架。会议室安静了半刻钟，预算案表决通过。"
 DWF_faction.22.a:0 "数字不会吵架"
 DWF_faction.23.t:0 "会签制"
 DWF_faction.23.desc:0 "新党魁推行会签制：军令、政令、财令，没有三个派系会签的章，一律不发。公文慢了下来，有人抱怨误事。党魁说：「慢一点，路走得直。快出来的事，返工的更多。」年底统计，返工公文比去年少了七成。"
 DWF_faction.23.a:0 "慢一点，走得直"

# --- SetB 红石派执政(雷石东1.0) ---
 DWF_faction.31.t:0 "第一次通电"
 DWF_faction.31.desc:0 "雷石东1.0就任后的第一次全国通电广播，全文二百一十四字，播了三分钟——其中四十秒是机房散热扇的声音，工程师忘了关麦克风。第二天来信问得最多的不是政见，是：那个嗡嗡声是什么？回电只有一句：那是它在呼吸。"
 DWF_faction.31.a:0 "它在呼吸"
 DWF_faction.32.t:0 "零号报告"
 DWF_faction.32.desc:0 "红岩零号机向新党魁提交第一份国情报告，四十七页，结论栏只有四个字：「可以运行。」有人问红岩为什么结论这么短，红岩说：结论以上的四十七页，每一段都是这四个字的证据。雷石东在报告封面批了两个字：已阅。"
 DWF_faction.32.a:0 "已阅"
 DWF_faction.33.t:0 "机器的休息日"
 DWF_faction.33.desc:0 "雷石东颁布《机器休息日条例》：每周日，政务大厅的铜喇叭停播一小时，机房降载运行。有人问机器又不需要休息。雷石东答：停的不是机器，是人心里那根弦——要让所有人知道，机器停下来的那一小时，天没有塌。"
 DWF_faction.33.a:0 "天没有塌"

# --- SetB 共同体派执政 ---
 DWF_faction.41.t:0 "新话草案"
 DWF_faction.41.desc:0 "新党魁颁行《简明语汇表（草案）》：词汇合并，句式从简——「战争恐惧」合并为「外患」，「不同意见」合并为「杂音」，「批评大会」合并为「学习小组」。起草处的笔杆子发现，合并到最后一页，字典薄了三分之一。"
 DWF_faction.41.a:0 "字典薄了"
 DWF_faction.42.t:0 "墙上的标语"
 DWF_faction.42.desc:0 "城乡的墙上刷满新标语，白灰黑字，四米一个：「多玩在看着你。」刷标语的工人不识几个字，但每一笔都刷得很匀——验收的说，匀比懂重要。标语刷到村口，老太太问看的是什么，孙子念给她听，她点点头：看得住就好。"
 DWF_faction.42.a:0 "看得住就好"
 DWF_faction.43.t:0 "互相监督条例"
 DWF_faction.43.desc:0 "《邻里互监条例》颁布，每十户设一检举箱，三日一开。第一周收检举信一百二十七封——一百一十九封检举的是邻居家的鸡越了界。治安处把信归档，档号连着排下去。条例第五条：检举属实者，记功一次。"
 DWF_faction.43.a:0 "记功一次"

# --- SetC 决议叙事池 ---
 DWF_faction.51.t:0 "支部联席夜"
 DWF_faction.51.desc:0 "两派支部的联席会开到半夜，散会时谁也没说服谁。出门下了雪，两拨人在同一家面馆碰上，拼了桌。煮面的师傅听了半宿，说了一句：吵是吵给你们自己听的，面是面给大家吃的。那晚两拨人AA了账。"
 DWF_faction.51.a:0 "面给大家吃的"
 DWF_faction.52.t:0 "墙报论战"
 DWF_faction.52.desc:0 "机关大院的墙报，解放派占左半版，协调派占右半版，中间画了条线。这期的题目：南下早了好还是晚了好。读者来信堆满传达室——大半不是站队的，是要求两边「都说得再明白点，别光喊」。"
 DWF_faction.52.a:0 "别光喊"
 DWF_faction.53.t:0 "马灯与算盘"
 DWF_faction.53.desc:0 "驻村动员干部和县里账房先生同住一屋：一个夜里擦枪，一个拨算盘，油灯两头用。干部问账房算的什么，账房说算你下个月的口粮；账房问枪擦的什么，干部说擦给你拨算盘的日子。两人都没再说话。"
 DWF_faction.53.a:0 "一盏灯，两头用"
 DWF_faction.54.t:0 "大会筹备处的一日"
 DWF_faction.54.desc:0 "筹备处今天接待了两拨请愿团：上午解放派要求把「南征」写进大会议程，下午协调派要求把「宪章」排在第一项。处长两边都答「一定转达」，记事本上同一句话写了两遍。晚上他把本子翻给副手看：你瞧，两边要的其实是同一场大会。"
 DWF_faction.54.a:0 "同一场大会"

# --- SetD 闭幕补遗 ---
 DWF_faction.61.t:0 "红石工程院来信"
 DWF_faction.61.desc:0 "大会闭幕后第三周，红石工程院寄来贺信，落款是全体研究员——最末一行是一台机器的名字栏，盖着「待命名」的章。院长附言：它参与了贺信的排版，排了七遍，说前六遍「情感冗余」。"
 DWF_faction.61.a:0 "第七遍很好"
 DWF_faction.62.t:0 "老旗"
 DWF_faction.62.desc:0 "大会闭幕，会旗降下。旗手叠旗时问秘书长：这旗收在哪里？秘书长说：叠好，放干燥处。旗手又问：下次用是什么时候？秘书长看着旗上的折痕：「还要用——旗这东西，叠过一次，下次展开就快了。」"
 DWF_faction.62.a:0 "下次展开就快了"
